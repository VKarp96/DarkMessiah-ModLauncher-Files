name: Non-Steam 1.02 patcher tests

on:
  push:
    paths:
      - 'compatibility/nonsteam_102/**'
      - '.github/workflows/nonsteam-102-compat.yml'
  pull_request:
    paths:
      - 'compatibility/nonsteam_102/**'
      - '.github/workflows/nonsteam-102-compat.yml'

permissions:
  contents: read

jobs:
  synthetic-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without proprietary game fixtures
        working-directory: compatibility/nonsteam_102
        run: python -m unittest -v test_patcher.py
